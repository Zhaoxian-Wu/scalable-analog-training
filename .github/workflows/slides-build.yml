name: Build and publish slides

on:
  push:
    branches: [slides]
  pull_request:
    paths:
      - 'slides/**'
      - '.github/workflows/slides-build.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Install dependencies
        working-directory: slides
        run: npm ci

      - name: Build slides
        working-directory: slides
        run: npm run build -- --base /scalable-analog-training/slides/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/slides'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Zhaoxian-Wu/scalable-analog-training/.github/workflows/website-pages.yml@website
