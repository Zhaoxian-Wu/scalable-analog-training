name: Deploy website and slides

on:
  push:
    branches: [website]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/website' && github.sha || 'website' }}

      - name: Check out slides
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref == 'refs/heads/slides' && github.sha || 'slides' }}
          path: _slides
          sparse-checkout: slides

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            _slides/slides/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/configure-pages@v5

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build interactive diagrams
        working-directory: website
        run: npm run build:interactives

      - name: Build static website
        run: python3 website/build.py

      - name: Install slide dependencies
        working-directory: _slides/slides
        run: npm ci

      - name: Build slides for the Pages subdirectory
        working-directory: _slides/slides
        run: npm run build -- --base /scalable-analog-training/slides/

      - name: Include slides in the website artifact
        run: cp -a _slides/slides/dist website/dist/slides

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
